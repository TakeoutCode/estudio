# QUALITY QA4: checks obligatorios para fusionar a main, en orden: `checks` (pasos 1-5; la
# integración de la api con Testcontainers corre dentro de `pnpm test`) y, si pasa, `e2e` (paso 6).
# `security` (paso 7) corre en paralelo para que un secreto se vea aunque falle lo demás.
# Lighthouse todavía no (deuda).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # QA4 paso 1: caché de Turbo; una tarea cuyas entradas no cambiaron no se vuelve a correr.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # El cliente de Prisma no se versiona (apps/api/src/generated): sin él la api no compila.
      - name: Cliente de Prisma
        run: pnpm db:generate

      - name: Tipos
        run: pnpm typecheck

      - name: Lint (incluye lint:copy)
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Pruebas (con cobertura mínima en shared, srs y los módulos sync de api y web)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Presupuesto de JS inicial (FRONTEND FE9)
        run: pnpm --filter @estudio/web size

      - name: Ningún secreto en el bundle de la web
        run: |
          if grep -rEl 'sk-[A-Za-z0-9_-]{20,}|CLOUDINARY_API_SECRET|VAPID_PRIVATE' apps/web/dist; then
            echo "Hay un secreto en apps/web/dist (AGENTS §5)" && exit 1
          fi

  # QA4 paso 6: Playwright en iPhone (WebKit) y escritorio (Chromium) contra la API real.
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Paquetes compartidos y cliente de Prisma
        run: pnpm --filter @estudio/shared --filter @estudio/srs build && pnpm db:generate

      - name: Navegadores
        run: pnpm --filter @estudio/web exec playwright install --with-deps webkit chromium

      # playwright.config.ts migra la base, compila y levanta la api y la vista previa de la PWA.
      - name: E2E
        run: pnpm --filter @estudio/web test:e2e
        env:
          E2E_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e

      - name: Reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Dependencias con vulnerabilidades altas
        run: pnpm audit --prod --audit-level high
